name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tunas
          POSTGRES_PASSWORD: tunas
          POSTGRES_DB: tunas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tunas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tunas:tunas@localhost:5432/tunas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: test
        run: go test -race ./...

      - name: build agent (windows)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/agent

      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
